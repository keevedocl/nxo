<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
  />

  <meta name="theme-color" content="#08111f" />

  <!-- Configuración para iPhone / PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  />
  <meta name="apple-mobile-web-app-title" content="NXO" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />

  <!-- Iconos -->
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" href="icons/icon-192.png" />

  <!-- Estilos de NXO -->
  <link rel="stylesheet" href="styles.css" />

  <title>NXO</title>
</head>

<body>

  <!-- =========================
       APLICACIÓN NXO
  ========================== -->
  <div id="app">

    <!-- =========================
         BARRA SUPERIOR
    ========================== -->
    <header class="topbar glass">

      <div>
        <p
          class="eyebrow"
          id="todayLabel"
        >
          HOY
        </p>

        <h1 id="greeting">
          NXO
        </h1>
      </div>

      <button
        class="icon-btn"
        id="openSettingsBtn"
        aria-label="Configuración"
      >
        ⚙️
      </button>

    </header>


    <!-- =========================
         CONTENIDO PRINCIPAL

         JavaScript irá cambiando
         automáticamente esta zona
         según la sección abierta.
    ========================== -->
    <main
      id="view"
      class="view"
    ></main>


    <!-- =========================
         BOTÓN RÁPIDO +

         Permite añadir:
         - Tareas
         - Hábitos
         - Ramos
         - Objetivos
         - Gastos
         - Entrenamientos
         - Focus
         - Notas
         - Agua
    ========================== -->
    <button
      id="fab"
      class="fab"
      aria-label="Añadir"
    >
      ＋
    </button>


    <!-- =========================
         NAVEGACIÓN INFERIOR
    ========================== -->
    <nav class="bottom-nav glass">

      <!-- HOY -->
      <button
        data-route="home"
        class="nav-item active"
      >
        <span>⌂</span>
        <small>Hoy</small>
      </button>


      <!-- PLANIFICACIÓN -->
      <button
        data-route="plan"
        class="nav-item"
      >
        <span>✓</span>
        <small>Plan</small>
      </button>


      <!-- PROGRESO -->
      <button
        data-route="progress"
        class="nav-item"
      >
        <span>◈</span>
        <small>Progreso</small>
      </button>


      <!-- VIDA -->
      <button
        data-route="life"
        class="nav-item"
      >
        <span>♥</span>
        <small>Vida</small>
      </button>


      <!-- PERFIL -->
      <button
        data-route="profile"
        class="nav-item"
      >
        <span>●</span>
        <small>Perfil</small>
      </button>

    </nav>

  </div>


  <!-- =========================
       PANEL DESLIZABLE

       Se utiliza para abrir:
       - Añadir tarea
       - Añadir gasto
       - Focus
       - Configuración
       - Personalización
       - Temas
       - Universidad
       - Etc.
  ========================== -->
  <dialog
    id="sheet"
    class="sheet"
  >

    <form
      method="dialog"
      class="sheet-card glass"
      id="sheetCard"
    >

      <!-- Indicador superior -->
      <div class="sheet-handle"></div>


      <!-- Cerrar -->
      <button
        class="sheet-close"
        value="cancel"
        aria-label="Cerrar"
      >
        ×
      </button>


      <!--
        JavaScript introduce aquí
        el contenido correspondiente.
      -->
      <div id="sheetContent"></div>

    </form>

  </dialog>


  <!-- =========================
       IMPORTAR BACKUP NXO
  ========================== -->
  <input
    type="file"
    id="importFile"
    accept=".json,application/json"
    hidden
  />


  <!-- =========================
       GENERACIÓN DE PDF

       jsPDF permite crear los
       informes de progreso.
  ========================== -->
  <script
    src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"
  ></script>


  <!-- =========================
       CÓDIGO PRINCIPAL DE NXO
  ========================== -->
  <script src="app.js"></script>

</body>
</html>
